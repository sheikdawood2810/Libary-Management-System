<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Overdue Books - Library Management System</title>

    <link rel="stylesheet" href="style.css">

    <!-- apply saved/system theme immediately, before the page paints,
         so there's no flash of the wrong mode -->
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>

<body>

    <nav class="navbar">
        <h2>📚 Library Management System</h2>

        <div class="nav-links">
            <a href="#" onclick="goDashboard()">Dashboard</a>
            <a href="books.html">Books</a>
            <a href="students.html">Students</a>
            <a href="borrows.html">Borrow</a>

            <div class="theme-buttons" id="themeButtons">
                <button type="button" class="theme-btn" data-theme-choice="light">☀️ Light</button>
                <button type="button" class="theme-btn" data-theme-choice="dark">🌙 Dark</button>
            </div>
        </div>
    </nav>

    <main class="dashboard">

        <h1>⚠️ Overdue Books</h1>
        <p>Books that have passed their due date</p>

        <div class="book-table-container">

            <table class="book-table">

                <thead>
                    <tr>
                        <th>Student Code</th>
                        <th>Book Code</th>
                        <th>Due Date</th>
                        <th>Overdue Days</th>
                        <th>Fine</th>
                    </tr>
                </thead>

                <tbody id="overdueList">
                </tbody>

            </table>

        </div>

    </main>

    <script src="theme.js"></script>
    <script src="overdue.js"></script>

</body>

</html>
