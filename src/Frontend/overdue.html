<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Overdue Books - Library Management System</title>

    <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/4a876dae9c.js" crossorigin="anonymous"></script>
</head>

<body>

    <nav class="navbar">
        <h2> Library Management System</h2>

        <div class="nav-links">
            <a href="#" onclick="goDashboard()">Dashboard<i class="fa-solid fa-house"></i></a>
            <a href="books.html">Books<i class="fa-solid fa-book-open"></i></a>
            <a href="students.html">Students<i class="fa-solid fa-users"></i></a>
            <a href="borrows.html">Borrow<i class="fa-solid fa-arrows-left-right"></i></a>
        </div>
    </nav>

    <main class="dashboard">

        <h1> Overdue Books<i class="fa-solid fa-x"></i></h1>
        <p>Books that have passed their due date</p>

        <div class="book-table-container">

            <table class="book-table">

                <thead>
                    <tr>
                        <th>Student Code</th>
                        <th>Book Code</th>
                        <th>Due Date</th>
                        <th>Overdue Days</th>
                        <th>Fine</th>
                    </tr>
                </thead>

                <tbody id="overdueList">
                </tbody>

            </table>

        </div>

    </main>

    <script src="overdue.js"></script>

</body>

</html>
