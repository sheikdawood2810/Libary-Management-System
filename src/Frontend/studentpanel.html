<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://kit.fontawesome.com/4a876dae9c.js" crossorigin="anonymous"></script>
</head>

<body>

    <nav class="navbar">

        <h2> Library Management System</h2>

        <div class="nav-links">
            <a href="studentpanel.html">Dashboard<i class="fa-solid fa-house"></i></a>
            <a href="books.html">Books<i class="fa-solid fa-book-open"></i></a>
            <a href="students.html">My Profile<i class="fa-regular fa-user"></i></a>
            <a href="borrows.html">My Borrows<i class="fa-solid fa-arrows-left-right"></i></a>

   <button type="button" onclick="logout()">
        Logout
    <i class="fa-solid fa-circle-left"></i>
     </button>
    </div>

    </nav>


    <main class="dashboard">

        <h1><i class="fa-solid fa-house"></i> Student Dashboard</h1>

        <p>Welcome to the Library Management System</p>


        <div class="cards">

            <!-- Books -->

            <div class="card"
                 onclick="window.location.href='books.html'">

                <h3> Books<i class="fa-solid fa-book-open"></i></h3>

                <p id="totalBooks">0</p>

            </div>


            <!-- Active Borrows -->

            <div class="card"
                 onclick="window.location.href='borrows.html'">

                <h3> My Active Borrows<i class="fa-solid fa-arrows-left-right"></i></h3>

                <p id="activeBorrows">0</p>

            </div>


            <!-- Overdue Books -->

            <div class="card"
                 onclick="window.location.href='overdue.html'">

                <h3> My Overdue Books<i class="fa-solid fa-xmark"></i></h3>

                <p id="overdueBooks">0</p>

            </div>

        </div>

    </main>


    <!-- Dashboard JavaScript -->

    <script src="auth.js"></script>

<script>
    requireStudent();
</script>

<script src="script.js"></script>
</body>

</html>
